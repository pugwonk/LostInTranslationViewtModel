[HEADER]
VERSION=2


[BASIC]
; CG raised 0.08m (0.488 -> 0.568) for body roll: BASEY is 0.08 more negative and GRAPHICS_OFFSET in car.ini 0.08 lower, so ride height is unchanged
WHEELBASE=2.36						; Wheelbase distance in meters
CG_LOCATION=0.64						; Front weight share. Was 0.69 (a guess); FWD hatchbacks in AC use 0.62-0.65 (K11 ~62%, Viewt a bit nose-heavy)

; 2024+ race cars: Bilstein B4 dampers (damping ~10% up vs the pre-2024 ones), HOL 60mm lowering springs
; front and rear, front and rear sway bars. All figures are estimates.
[ARB]
FRONT=14000							; Front antiroll bar stifness. in N/m. Aftermarket front sway bar (2024+); size not checked, 10000 before the 2024 upgrades
REAR=8000								; Rear antiroll bar stifness. in N/m. Aftermarket rear sway bar (2024+); size not checked, 5000 before the 2024 upgrades

[FRONT]
TYPE=STRUT								; DWB ,STRUT
BASEY=-0.21								; -0.2 on the 2023 car. BASEY is where the front wheel centre sits relative to the CG, so +0.07 puts the body 70mm lower at the front (HOL lowering springs; +0.11 looked too low). Not a CG height
TRACK=1.43								; Track width in meters (from pivot 3D placement of the 3d model of a wheel)
ROD_LENGTH=0.040						; Same as the 2023 car: changing it had no visible effect on ride height in the game
HUB_MASS=35								; was 45. Heavy unsprung mass adds to tyre-load spikes over bumps (Miata 29.5, exmods K11 40)
RIM_OFFSET=0.0

; FFB (2026-10): steering axis set to KPI 14deg, caster 2deg, scrub 55mm (K11-style; the exmods K11 Micra uses 12.9/1.4). Low caster keeps
; bump kick and speed-growing trail weight down; KPI x scrub gives steady weight-jacking centring. Linkage shifted as a unit
; (arm lengths kept), inner tie-rod end placed for ~zero bump steer. Earlier tries: 25mm/4deg (no heft), 45mm/5deg (bumps still strong).
; Originally scrub 82mm, caster 8.4deg, ~1deg bump steer over 40mm, KPI 11.6/12.9.
STRUT_CAR=0.22744, 0.40361, -0.01482
STRUT_TYRE=0.10153, -0.10138, 0.00281
