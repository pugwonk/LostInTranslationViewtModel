[CONTROLS]
FFMULT=5.1				; was 2.5 with STEER_ASSIST 0.6, then 3.5 (too light), then 4.0 before the rod ratio fix (x1.29 for the slower true ratio). Heavy power assistance: lighter than the depowered 2026 car
STEER_ASSIST=1.0			; was 0.6. AC raises the normalised FFB force to this power, so <1 boosts small forces (0.05 came out as 0.17) and every road bump felt like gravel. Kunos road cars all use 1.0; assistance is modelled with FFMULT
STEER_LOCK=540				; was 400, which with the old rod ratio really gave 32.1 deg of wheel lock; 540/16 = 33.75 deg keeps the turning circle
STEER_RATIO=16
LINEAR_STEER_ROD_RATIO=0.00123		; rack metres per degree of wheel angle, measured from the suspensions.ini front geometry (Kunos match theirs to it). Was 0.00157, so the true ratio was ~12:1, not STEER_RATIO 16

