; Custom Shaders Patch car config. The rest of the car is configured in data/.
; Without CSP none of this applies and the dash screen (REAR_VIEW_DISPLAY) stays a plain black screen.

[INCLUDE: common/materials_interior.ini]

; The rear-view camera screen on the dash. A real camera on the roof, looking back, draws onto it through
; rear_camera.lua, so the picture is a fixed wide angle that doesn't depend on Real Mirrors. REAR_VIEW_DISPLAY
; is deliberately not listed in data/mirrors.ini: a mirror mesh gets the mirror's picture instead of this one.
;
; POSITION is the roof camera, CAMERA_5 in data/cameras.ini, which is in the car's physics coordinates; this
; file uses the model's, which are those plus GRAPHICS_OFFSET's opposite in data/car.ini (y +0.568, z +0.390).
; If GRAPHICS_OFFSET changes, move the camera by the same amount. Model coordinates: x is the car's left, y up,
; z forward.
[RENDERING_CAMERA_0]
DYNAMIC_TEXTURE_ID = rear_camera_raw
POSITION = -0.0099, 1.872, -0.525
DIRECTION = 0, -0.1883, -0.9821
FOV = 150                 ; degrees, before the fisheye pass below; raise it to see even more
RESOLUTION = 1024, 616
INCLUDE_CAR = 1
REFRESH_RATE = 20
INTERIOR_ONLY = 1
CLIP_NEAR = 0.005
ACTIVE_BY_DEFAULT = 0     ; rear_camera.lua switches it on, and only for the player's car
WITH_LIGHTING = 1

; Squeezes the very wide camera picture into a normal one, like a backup camera's fisheye lens, and sets its brightness.
[TEXTURE_PREPROCESSING_0]
DYNAMIC_TEXTURE_ID = rear_camera_view
TEXTURE_SOURCE = dynamic::rear_camera_raw
RESOLUTION = 512, 308     ; same shape as the screen (13 x 8 cm)
EFFECT = FISHEYE
INTENSITY = 1.5
EXPOSURE = 1
BRIGHTNESS = 0.7

[SCRIPTABLE_DISPLAY_0]
MESHES = REAR_VIEW_DISPLAY
RESOLUTION = 512, 308
DISPLAY_POS = 0, 0
DISPLAY_SIZE = 512, 308
SKIP_FRAMES = 0
ACTIVE_FOR_PLAYER_ONLY = 1
SCRIPT = rear_camera.lua

; Gives the screen the look of an LCD that lights itself instead of being shaded like plastic.
[Material_DigitalScreen]
Meshes = REAR_VIEW_DISPLAY
ScreenScale = 512         ; pixels across, as in RESOLUTION
ScreenAspectRatio = 0.6   ; height / width
MatrixType = TN
Emissive = 6               ; screen brightness; 3 looked dim in the cockpit

; The dash clock. clock.lua turns the two hand nodes (CLOCK_HOUR_HAND and CLOCK_MINUTE_HAND, the pivots the hand meshes hang
; from) to the time: the PC's clock, or the session's time of day if USE_GAME_TIME is set in clock.lua. It runs for every car,
; so other cars' clocks tell the time too.
[SCRIPT_0]
SCRIPT = clock.lua
