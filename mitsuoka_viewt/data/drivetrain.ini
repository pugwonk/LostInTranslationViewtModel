[HEADER]
VERSION=3

[TRACTION]
TYPE=FWD

[GEARS]
COUNT=3
GEAR_R=-2.3
GEAR_1=2.8
GEAR_2=1.5
GEAR_3=1
FINAL=4.0 ; Real Micra ratio. Was 4.4 to compensate for the weak engine curve (CR, 2024-10-18); the curve now matches a real 54bhp K11 1.0

[DIFFERENTIAL]
POWER=0.05
COAST=0.05
PRELOAD=2

[GEARBOX]
CHANGE_UP_TIME=500
CHANGE_DN_TIME=880
AUTO_CUTOFF_TIME=200
SUPPORTS_SHIFTER=1
VALID_SHIFT_RPM_WINDOW=600
CONTROLS_WINDOW_GAIN=0.2
INERTIA=0.0160

[CLUTCH]
MAX_TORQUE=180

[AUTOCLUTCH]
UPSHIFT_PROFILE=UPSHIFT_PROFILE
DOWNSHIFT_PROFILE=DOWNSHIFT_PROFILE
;UP/DOWNSHIFT_PROFILE, NONE
MIN_RPM=1900
MAX_RPM=2700
USE_ON_CHANGES=1
FORCED_ON=0 ;1 for semiauto
; MIN/MAX_RPM were 1200/1800: AC has no torque converter, so the 3AT launch bogged on ~30Nm. Now ~stall speed (more torque during slip).

[AUTOBLIP]
ELECTRONIC=0
POINT_0=55 ;Full throttle
POINT_1=135 ;Releasing throttle
POINT_2=260 ;Zero throttle
LEVEL=0.5

[DOWNSHIFT_PROTECTION]
ACTIVE=0
DEBUG=0
OVERREV=200
LOCK_N=1

[UPSHIFT_PROFILE]
POINT_0=100 ;Full clutch
POINT_1=200 ;Releasing clutch
POINT_2=300	;Zero clutch

[DOWNSHIFT_PROFILE]
POINT_0=55 ;Full clutch
POINT_1=200 ;Releasing clutch
POINT_2=300	;Zero clutch

[DAMAGE]
RPM_WINDOW_K=100

[AUTO_SHIFTER]
UP=6000
DOWN=2900 ; was 3300 (must stay under ~3270 or 1st<->2nd hunts): an upshift 1st->2nd at 6100 rpm drops the revs to ~3270, below 3300, so the box hunted back down (each shift is 0.5-0.9s)
SLIP_THRESHOLD=1.10
GAS_CUTOFF_TIME=0.50