; Custom Shaders Patch car config. The rest of the car is configured in data/.
; Without CSP none of this applies and the dash clock just stays at 10:08.
; This car has no rear-view camera screen, so unlike the 2024 car's ext_config.ini this has only the clock. Kept by hand;
; build.bat copies clock.lua here from the 2024 car.

; The dash clock. clock.lua turns the two hand nodes (CLOCK_HOUR_HAND and CLOCK_MINUTE_HAND, the pivots the hand meshes hang
; from) to the time: the PC's clock, or the session's time of day if USE_GAME_TIME is set in clock.lua. It runs for every car,
; so other cars' clocks tell the time too.
[SCRIPT_0]
SCRIPT = clock.lua
