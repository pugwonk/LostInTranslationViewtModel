; Custom Shaders Patch car config. The rest of the car is configured in data/.
; Without CSP none of this applies: the dash clock just stays at 10:08 and the dials aren't lit at night.
; This car has no rear-view camera screen, so unlike the 2024 car's ext_config.ini this has only the clock and the gauge
; backlight. Kept by hand.

[INCLUDE: common/custom_emissive.ini]

; Gauge backlight. The four dial faces are black with white markings, and they share the CarpaintInterior material with most
; of the dash, so data/lights.ini can't light them (lighting a material lights every mesh that uses it). This lights only these
; four meshes, and on them only the bright parts of the texture (the numbers, ticks and clock dots), white, whenever the
; headlights are on; the needles stay amber through data/lights.ini. Raise DashHighlightColor for brighter dials; From/To are
; the texture brightness where the glow starts and is full, so lower From to light dimmer markings.
[CustomEmissive]
Meshes = Speedometer face, Fuel gauge face, Temp gauge face, Clock face
DashHighlightColor = 2, 2, 1.9
@ = CustomEmissive_CoverAll
@ = CustomEmissive_UseDiffuseLuminocity, From = 0.25, To = 0.7
@ = DashHighlight

; The clock's hands use the shared Chrome material, so they get the same treatment: lit white all over with the headlights.
[CustomEmissive]
Meshes = Clock hour hand, Clock minute hand
DashHighlightColor = 1.5, 1.5, 1.4
@ = CustomEmissive_CoverAll
@ = CustomEmissive_SkipDiffuseMap
@ = DashHighlight

; The dash clock. clock.lua turns the two hand nodes (CLOCK_HOUR_HAND and CLOCK_MINUTE_HAND, the pivots the hand meshes hang
; from) to the time: the PC's clock, or the session's time of day if USE_GAME_TIME is set in clock.lua. It runs for every car,
; so other cars' clocks tell the time too.
[SCRIPT_0]
SCRIPT = clock.lua
