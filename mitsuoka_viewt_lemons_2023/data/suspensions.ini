[HEADER]
VERSION=2


[BASIC]
; ROD_LENGTH was 0.040/0.036. With soft springs and wide bump stops the car sits ~8cm lower than it did (it used to rest on the narrow stops), so +0.08 here puts the ride height back.
; Bump stops/packers were capping roll (confirmed by removing them); now set wide. Springs 20000/13500 keep the front firmer than the rear for turn-in.
; CG raised 0.08m (0.488 -> 0.568) for body roll: BASEY is 0.08 more negative and GRAPHICS_OFFSET in car.ini 0.08 lower, so ride height is unchanged
WHEELBASE=2.36						; Wheelbase distance in meters
CG_LOCATION=0.64						; Front weight share. Was 0.69 (a guess); FWD hatchbacks in AC use 0.62-0.65 (K11 ~62%, Viewt a bit nose-heavy)

; Tuning for more roll, starting from the original: springs were 32760/34500, ARBs 10000/5000 (now removed), damping x1.25.
[ARB]
FRONT=0							; Front antiroll bar stifness. in N/m TODO this is a total guess.
REAR=0								; Rear antiroll bar stifness. in N/m TODO this is a total guess

[FRONT]
TYPE=STRUT								; DWB ,STRUT
BASEY=-0.28								; Distance of CG from the center of the wheel in meters. Front Wheel Radius+BASEY=front CoG. Actual CG height =(FWR+FBasey)+(RWR+Rbasey))/CG_LOCATION%
TRACK=1.43								; Track width in meters (from pivot 3D placement of the 3d model of a wheel)
ROD_LENGTH=0.120						; push rod length in meters. positive raises ride height, negative lowers ride height.
HUB_MASS=45								; masse sospese anteriori
RIM_OFFSET=0.0

STRUT_CAR=0.24083, 0.46361, -0.07195
STRUT_TYRE=0.12495, -0.10138, 0.00281
WBCAR_BOTTOM_FRONT=0.42459, -0.07639, 0.27323
WBCAR_BOTTOM_REAR=0.43308, -0.13122, -0.05298
WBTYRE_BOTTOM=0.12495, -0.10138, 0.00281
WBCAR_STEER=0.43981, -0.11922, 0.06899
WBTYRE_STEER=0.10431, -0.09843, 0.06899

TOE_OUT=-0.00030						; Toe-out expressed as the length of the steering arm in meters
STATIC_CAMBER=-0.6						; Static Camber in degrees. Actual camber relative to suspension geometry and movement, check values in game
SPRING_RATE=20000						; Wheel rate stifness in N/m. Do not use spring value but calculate wheel rate
PROGRESSIVE_SPRING_RATE=1000			; progressive spring rate in N/m/m

BUMP_STOP_RATE=35000						; bump stop spring rate
BUMPSTOP_UP=0.200						; meters to upper bumpstop from the 0 design of the suspension
BUMPSTOP_DN=0.150						; meters to bottom bumpstop from the 0 design of the suspension
PACKER_RANGE=0.300						; Total suspension movement range, before hitting packers
DAMP_BUMP=3460
DAMP_FAST_BUMP=1570	
DAMP_FAST_BUMPTHRESHOLD=0.050						
DAMP_REBOUND=7190
DAMP_FAST_REBOUND=6160	
DAMP_FAST_REBOUNDTHRESHOLD=0.130

[REAR]
TYPE=AXLE								; solid beam axle, links in the AXLE section below (was DWB). No square brackets in comments: AC reads them as section headers
BASEY=-0.28 ; Distance of CG from the center of the wheel in meters. Rear Wheel Radius+BASEY=Rear CoG  Actual CG height =(FWR+FBasey)+(RWR+Rbasey))/CG_LOCATION%
TRACK=1.43
ROD_LENGTH=0.120
HUB_MASS=50
RIM_OFFSET=0.040	

WBCAR_TOP_FRONT=0.36334, 0.05514, 0.18607
WBCAR_TOP_REAR=0.41921, 0.07956, -0.02748
WBCAR_BOTTOM_FRONT=0.40542, -0.10490, 0.24865
WBCAR_BOTTOM_REAR=0.55424, -0.11491, -0.15625
WBTYRE_TOP=0.13344, 0.09251, 0.03711
WBTYRE_BOTTOM=0.13509, -0.12886, -0.01624
WBCAR_STEER=0.52136, -0.04532, -0.20682
WBTYRE_STEER=0.14284, -0.05236, -0.17389

TOE_OUT=0.00050
STATIC_CAMBER=-0.6

SPRING_RATE=13500
PROGRESSIVE_SPRING_RATE=0

BUMP_STOP_RATE=22000
BUMPSTOP_UP=0.200
BUMPSTOP_DN=0.150
PACKER_RANGE=0.300

DAMP_BUMP=2060
DAMP_FAST_BUMP=1220	
DAMP_FAST_BUMPTHRESHOLD=0.050						
DAMP_REBOUND=3700
DAMP_FAST_REBOUND=2270	
DAMP_FAST_REBOUNDTHRESHOLD=0.130				

[AXLE]
; Solid rear beam, as on the K11 March (coil springs, trailing links, Panhard rod). Layout copied from the Kunos AE86/Escort Mk1.
; Points are relative to the axle centre (wheel-centre height), +x left, +z forward. The WB* points in the REAR section are left in, as Kunos do; AXLE probably does not use them.
LINK_COUNT=5
J0_CAR=0.5500,-0.080,0.450		; left lower trailing link, car end
J0_AXLE=0.5500,-0.080,0.0		; left lower trailing link, axle end
J1_CAR=-0.5500,-0.080,0.450		; right lower trailing link, car end
J1_AXLE=-0.5500,-0.080,0.0		; right lower trailing link, axle end

J2_CAR=0.3000,0.060,0.250		; left upper link, car end
J2_AXLE=0.3000,0.060,0.0		; left upper link, axle end
J3_CAR=-0.3000,0.060,0.250		; right upper link, car end
J3_AXLE=-0.3000,0.060,0.0		; right upper link, axle end

J4_CAR=0.450,0.040,-0.100		; Panhard rod, car end (left). Its height sets the rear roll centre (~wheel centre + 40mm)
J4_AXLE=-0.450,0.040,-0.100		; Panhard rod, axle end (right)

TORQUE_REACTION=0			; undriven axle (FWD), so no drive torque to react
ATTACH_REL_POS=0.80			; springs/dampers sit at 80% of the half-track, close to the wheels as on the K11
LEAF_SPRING_LAT_K=0			; coil springs, no leaf

[GRAPHICS_OFFSETS]
WHEEL_LF=0.0					;Left front graphical offset of the wheel positioning in the x axis (width). + is left - is right movement
SUSP_LF=0.0					;Left front graphical offset of the suspension positioning in the x axis (width). + is left - is right movement
WHEEL_RF=0.0					; Right front as above
SUSP_RF=0.0				; Right front as above
WHEEL_LR=0.0				; Left rear as above
SUSP_LR=0.0				; Left rear as above
WHEEL_RR=0.0			; Right rear as above
SUSP_RR=0.0			; Right rear as above

[DAMAGE]

MIN_VELOCITY=40				; MINUMUM VELOCITY TO START TAKING DAMAGE
GAIN=0.0004					; AMOUNT OF STEER ROD DEFLECTION FOR IMPACT KMH
MAX_DAMAGE=0.05			; MAXIMUM AMOUNT OF STEER ROD DEFLECTION ALLOWED
DEBUG_LOG=1					; ACTIVATES DAMAGE DEBUG IN THE LOG

