; colliders are used for optimizing performance of collisions of the bottom of the car with the asphalt and kerbs
; it is advisable to use just one that goes the front tyres to the rear tyres
; you could use more than one but we greatly advice to never use more than 2-3 in order to keep CPU occupancy low. 
; Keep in mind that the 3D collider also does collisions properly so use the colliders.ini just for car bottom collisions

; Viewt: the box sits on the chassis floor, tyre to tyre. The floor is 0.17 m above the road in the model and GRAPHICS_OFFSET y is -0.568,
; so its underside is at y -0.40 and the 0.1 thick box is centred on -0.35. z is the middle of the wheelbase (front axle at +0.85, rear at -1.51)
; and it runs from the front edge of the front tyres to the back edge of the rear ones. The sample car's values were y -0.195, z -0.12, 2.75 long.
[COLLIDER_0]
CENTRE=0 ,-0.35 ,-0.33 	; where the center of the collision box will be placed. 0,0,0 XYZ reference is the CoG
SIZE=1.25 ,0.1 ,2.94		; the size of the collision box in XYZ meters
GROUND_ENABLE=1
